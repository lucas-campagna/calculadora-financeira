<!doctype html>
<html lang="%HTML_LANG%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="description" content="%META_DESCRIPTION%" />
    <meta name="keywords" content="%META_KEYWORDS%" />
    <meta name="theme-color" content="#ff3e00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CalcFin" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <meta name="google-adsense-account" content="ca-pub-1972364870511142" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%OG_URL%" />
    <link rel="canonical" href="%CANONICAL_URL%" />
    <title>%PAGE_TITLE%</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="static-content-wrapper">%STATIC_CONTENT%</div>

    <div id="svelte-app" style="display: none;">
      %sveltekit.body%
    </div>

    <script>
      (function() {
        var btns = document.querySelectorAll('[id^="go-to-app-btn"]');
        var staticWrapper = document.getElementById('static-content-wrapper');
        var svelteApp = document.getElementById('svelte-app');

        var showingDoc = false;
        staticWrapper.style.display = 'none';
        svelteApp.style.display = 'block';
        window.toggleDoc = () => {
          if (showingDoc) {
            staticWrapper.style.display = 'block';
            svelteApp.style.display = 'none';
          } else {
            staticWrapper.style.display = 'none';
            svelteApp.style.display = 'block';
          }
          showingDoc = !showingDoc;
        }
        btns.forEach(function(btn) {
          btn.addEventListener('click', window.toggleDoc)
        });
      })();
    </script>

    <script src="%sveltekit.assets%/registerSW.js"></script>
  </body>
</html>
